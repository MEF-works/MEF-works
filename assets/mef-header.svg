<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">MEFWorks Elite Systems Engineering</title>
  <desc id="desc">A dark command-grid banner with animated data paths connecting systems, payments, automation, and infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090f"/>
      <stop offset=".52" stop-color="#0a1522"/>
      <stop offset="1" stop-color="#071017"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset=".48" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#39d353" stop-opacity=".28"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#243244" stroke-opacity=".42" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1035" cy="158" r="190" fill="url(#glow)"/>

  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".82">
    <path d="M710 78H850L910 138H1085" stroke-dasharray="12 9">
      <animate attributeName="stroke-dashoffset" from="84" to="0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M670 158H820L880 218H1085" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="72" to="0" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M740 248H900L960 188H1120" stroke-dasharray="15 8">
      <animate attributeName="stroke-dashoffset" from="92" to="0" dur="4.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#39d353" filter="url(#softGlow)">
    <circle cx="850" cy="78" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="218" r="5"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="188" r="5"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="82" fill="#39d353" font-size="15" font-weight="700" letter-spacing="4">MEFWORKS™</text>
    <text x="60" y="148" fill="#f0f6fc" font-size="50" font-weight="750">ELITE SYSTEMS</text>
    <text x="60" y="202" fill="#f0f6fc" font-size="50" font-weight="750">ENGINEERING</text>
    <text x="64" y="244" fill="#9fb0c3" font-size="18" letter-spacing=".8">Products · Operations · Payments · Automation</text>
    <text x="64" y="280" fill="#58a6ff" font-size="14" font-weight="600">I DON'T FOLLOW PATHS. I BUILD ROADS.</text>

    <g fill="#c9d1d9" font-size="13" font-weight="600">
      <text x="940" y="66">SYSTEMS</text>
      <text x="1010" y="126">PAYMENTS</text>
      <text x="908" y="244">AUTOMATION</text>
      <text x="1010" y="278">INFRASTRUCTURE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#303b4b" stroke-width="2"/>
</svg>